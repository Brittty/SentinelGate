# Nginx config for the SentinelGate landing page.
#
# The container serves the whole repository so the landing page's relative
# links to ../README.md, ../docs/, and ../SECURITY.md resolve. The site itself
# lives under /web/.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index web/index.html;

    location = / {
        return 302 /web/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
