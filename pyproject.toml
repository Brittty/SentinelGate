[project]
name = "sentinelgate"
version = "0.1.0"
description = "Open-source self-defending security gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0.1,<7",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "joblib>=1.4,<2",
    "cvss>=3.1,<4",
    "requests>=2.32,<3",
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "flask>=3.0,<4",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "respx>=0.14,<1",
    "ruff>=0.8,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "S", "UP", "C4", "PL", "PT"]
ignore = ["S101", "S108", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelgate"]

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal expected values and import optional fixtures locally.
"tests/*" = ["PLR2004", "PLC0415", "N817", "F401"]
# Report generators and response actions expose explicit public signatures.
"reports/*.py" = ["PLR0913", "PLR0917", "PLR0915"]
"response/actions.py" = ["PLR0913", "PLR0917"]
# The simulator picks lab payloads pseudo-randomly; this is not security-sensitive.
"simulator/run.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"